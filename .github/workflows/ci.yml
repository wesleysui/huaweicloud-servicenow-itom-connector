name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Jest unit tests (pure mapping logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install
      - run: npm test

  terraform-static-checks:
    name: Terraform validate / fmt / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.5'
      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: terraform init (no backend, no credentials required)
        run: terraform -chdir=terraform init -backend=false
      - name: terraform validate
        run: terraform -chdir=terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: tflint
        run: |
          cd terraform
          tflint --init
          tflint

  json-fixture-lint:
    name: Validate mock payload JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint all fixture JSON files
        run: |
          for f in $(find servicenow -name '*.json'); do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done
